[project]
name = "rent-lobster"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "crawlee",
  "playwright",
  "python-dotenv",
  "pydantic",
  "httpx",
  "browserforge",
  "fastapi",
  "uvicorn[standard]",
  "proxy-py",
  "pillow",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.uv]
# Optional: if you want uv to always prefer the lock
# (uv sync already does)

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "live: opt-in tests that hit the real Zillow/StreetEasy/Craigslist sites. Run with `pytest -m live`.",
]
addopts = "-m 'not live'"